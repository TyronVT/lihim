[package]
name = "lihim-verifier"
description = "Groth16 BN254 verifier holding the Semaphore V4 verification keys (depths 1-32)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
lihim-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
lihim-common = { workspace = true, features = ["testutils"] }
serde_json = { workspace = true }
