[package]
name = "lihim-semaphore"
description = "Semaphore V4 groups on Soroban: LeanIMT with Poseidon, root history, nullifiers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
soroban-poseidon = { workspace = true }
lihim-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = { workspace = true }
lihim-common = { workspace = true, features = ["testutils"] }
serde_json = { workspace = true }
