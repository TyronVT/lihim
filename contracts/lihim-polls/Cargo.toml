[package]
name = "lihim-polls"
description = "Anonymous polls on top of LihimSemaphore (frozen root, one vote per member per poll)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
lihim-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = { workspace = true }
lihim-common = { workspace = true, features = ["testutils"] }
serde_json = { workspace = true }
# Registered natively in tests only; never linked into the polls wasm.
lihim-semaphore = { path = "../lihim-semaphore" }
lihim-verifier = { path = "../lihim-verifier" }
