[workspace]
resolver = "2"
members = ["lihim-common", "lihim-verifier", "lihim-semaphore", "lihim-polls"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Pinned to 28.x because soroban-poseidon 28.0.0 depends on soroban-sdk ^28;
# mixing 28 and 29 would put two incompatible `Env` types in the graph.
soroban-sdk = "28.0.0"
soroban-poseidon = "28.0.0"
ed25519-dalek = "2.1.1"
serde_json = "1"
lihim-common = { path = "lihim-common" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
